<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Patchbay logo">
  <title>Patchbay</title>

  <defs>
    <linearGradient id="pb-cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4da3ff"/>
      <stop offset="100%" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <!-- rack panel -->
  <rect x="7" y="16" width="106" height="88" rx="16"
        fill="none" stroke="#7d8da3" stroke-width="5"/>

  <!-- patch cable, jack to jack -->
  <path d="M33 62 C 33 30, 87 30, 87 62"
        fill="none" stroke="url(#pb-cable)" stroke-width="7" stroke-linecap="round"/>

  <!-- patched sockets -->
  <circle cx="33" cy="62" r="12" fill="none" stroke="#7d8da3" stroke-width="5"/>
  <circle cx="33" cy="62" r="4.5" fill="#4da3ff"/>
  <circle cx="87" cy="62" r="12" fill="none" stroke="#7d8da3" stroke-width="5"/>
  <circle cx="87" cy="62" r="4.5" fill="#a371f7"/>

  <!-- free sockets -->
  <circle cx="60" cy="62" r="5.5" fill="none" stroke="#7d8da3" stroke-width="4" opacity=".55"/>
  <circle cx="33" cy="87" r="5.5" fill="none" stroke="#7d8da3" stroke-width="4" opacity=".55"/>
  <circle cx="60" cy="87" r="5.5" fill="none" stroke="#7d8da3" stroke-width="4" opacity=".55"/>
  <circle cx="87" cy="87" r="5.5" fill="none" stroke="#7d8da3" stroke-width="4" opacity=".55"/>
</svg>
